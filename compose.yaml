services:
  api:
    build:
      context: .
    environment:
      PHISHGUARD_ENVIRONMENT: development
    init: true
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/home/phishguard/artifacts:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
