[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard-ai"
version = "0.4.0"
description = "An explainable AI phishing detection and prevention system"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Project contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.8,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
data = [
  "openpyxl>=3.1,<4.0",
]
ml = [
  "scikit-learn>=1.9,<2.0",
]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.15,<2.0",
  "openpyxl>=3.1,<4.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.11,<1.0",
  "scikit-learn>=1.9,<2.0",
  "types-openpyxl>=3.1,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
phishguard = ["static/*", "data/*.csv"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=phishguard --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["phishguard"]

[tool.coverage.report]
exclude_also = [
  "def main\\(\\) -> None:",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["phishguard"]

[[tool.mypy.overrides]]
module = ["joblib.*", "scipy.*", "sklearn.*"]
ignore_missing_imports = true
